name: Build

on:
  workflow_dispatch:
  pull_request:
  push:
    tags:
      - expo-orbit-v*

permissions:
  contents: read

jobs:
  validate_pull_request:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: 👀 Checkout
        uses: actions/checkout@v4
        with:
          submodules: true
      - name: ⬢ Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
      - name: 🧶 Install workspace node modules
        run: yarn install --frozen-lockfile
      - name: 📦️ Build packages
        run: yarn build
      - name: ✅ Confirm EAS is disabled for pull requests
        run: echo "Pull-request validation completed without installing or invoking EAS."

  build_on_linux:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: 👀 Checkout
        uses: actions/checkout@v4
        with:
          submodules: true
      - name: ⬢ Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 🧶 Install workspace node modules
        run: yarn install --frozen-lockfile
      - name: 📦️ Build packages
        run: yarn build
      - name: 🧶 Install electron node modules
        run: yarn install --frozen-lockfile
        working-directory: apps/menu-bar/electron
      - name: 📦️ Build electron app
        run: yarn make
        working-directory: apps/menu-bar/electron
      - name: 📤 Upload DEB artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-deb
          path: apps/menu-bar/electron/out/make/deb/x64/*.deb
      - name: 📤 Upload RPM artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-rpm
          path: apps/menu-bar/electron/out/make/rpm/x64/*.rpm

  build_on_win:
    if: github.event_name != 'pull_request'
    runs-on: windows-latest
    steps:
      - name: 👀 Checkout
        uses: actions/checkout@v4
        with:
          submodules: true
      - name: ⬢ Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 🧶 Install workspace node modules
        run: yarn install --frozen-lockfile
      - name: 📦️ Build packages
        run: yarn build
      - name: 🧶 Install electron node modules
        run: yarn install --frozen-lockfile
        working-directory: apps/menu-bar/electron
      - name: 📦️ Build electron app
        run: yarn make
        working-directory: apps/menu-bar/electron
      - name: 📤 Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: |
            apps/menu-bar/electron/out/make/squirrel.windows/x64/*Setup.exe
            apps/menu-bar/electron/out/make/squirrel.windows/x64/*.nupkg
            apps/menu-bar/electron/out/make/squirrel.windows/x64/RELEASES

  build_on_macos:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: 👀 Checkout
        uses: actions/checkout@v4
      - name: ⬢ Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 🧶 Install workspace node modules
        run: yarn install --frozen-lockfile
      - name: 📦️ Build packages
        run: yarn build
      - name: 🔐 Check EAS credentials
        id: eas_auth
        shell: bash
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [[ -n "${EXPO_TOKEN//[[:space:]]/}" ]]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping EAS build because EXPO_TOKEN is unavailable."
          fi
      - name: 📦 Install EAS CLI
        if: steps.eas_auth.outputs.available == 'true'
        run: npm install -g eas-cli
      - name: 🍎 Build and notarize macOS app
        if: steps.eas_auth.outputs.available == 'true'
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: eas build --platform ios --profile production --non-interactive
        working-directory: apps/menu-bar

  create_release:
    if: startsWith(github.ref, 'refs/tags/expo-orbit-v')
    needs: [build_on_linux, build_on_win]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 👀 Checkout
        uses: actions/checkout@v4

      - name: 📥 Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: 📝 Extract release notes from CHANGELOG
        id: notes
        run: |
          VERSION="${GITHUB_REF#refs/tags/expo-orbit-v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          # Extract the section for this version from CHANGELOG.md
          NOTES=$(awk "/^## ${VERSION} /{found=1; next} /^## [0-9]/{if(found) exit} found{print}" CHANGELOG.md)

          # Write to file for gh release
          echo "$NOTES" > release-notes.md

      - name: 🚀 Create draft GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ steps.notes.outputs.version }}"
          TAG="expo-orbit-v${VERSION}"

          gh release create "$TAG" \
            --draft \
            --title "v${VERSION}" \
            --notes-file release-notes.md

          # Upload artifacts individually to handle filenames with spaces
          find artifacts -type f \( -name "*.deb" -o -name "*.rpm" -o -name "*Setup.exe" -o -name "*.nupkg" -o -name "RELEASES" \) -print0 \
            | xargs -0 -I {} gh release upload "$TAG" "{}"
